<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Search App</title>
</head>
<body>
    <header>
        <h1>Recipe Search App</h1>
        <p>Find delicious recipes by igrednient</p>
    </header>
    <section>
        <h2>Search Recipes</h2>
        <form>
            <input type="text" placeholder="Enter ingredient">
            <button type="submit">Search</button>
        </form>
    </section>
    <section>
        <h2>Search Result</h2>
        <div>
            <p>Search for ignreditens to see recipes!</p>
        </div>
    </section>
    <section>
        <h2>Favorite Recipes</h2>
        <div>
            <p>No favorites yet. Add some recipes!</p>
        </div>
    </section>
    <footer>
        <p>Create by YOURTEAMNAME - 2025</p>
    </footer>
</body>
</html>
